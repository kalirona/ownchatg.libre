# Dokploy Docker Compose deployment for ownchagpt (LibreChat)
#
# IN DOKPLOY:
#   1. Project -> Docker Compose -> select this repo, set Compose File to
#      docker-compose.dokploy.yml.
#   2. In the compose env tab, set every variable listed in
#      .env.dokploy.example (DOMAIN_CLIENT, DOMAIN_SERVER, API_DOMAIN, ADMIN_DOMAIN,
#      ALLOWED_ORIGINS, MONGO_URI, JWT_SECRET, JWT_REFRESH_SECRET, CREDS_KEY, CREDS_IV,
#      MEILI_MASTER_KEY, ADMIN_PANEL_SESSION_SECRET). Deploy.
#
# MongoDB is a SEPARATE Dokploy app (deployed from the Dokploy marketplace).
# Apps and databases in Dokploy share the "dokploy-network" network. Compose
# projects get their own isolated network, so the api + admin-panel services
# are attached to BOTH (default + dokploy-network) here. Without this the API
# cannot resolve the MongoDB hostname and Traefik cannot route the domain.
#
# All app data (meili, uploads, images, logs, skill) lives in NAMED volumes so
# the container (running as uid 1000 / the `node` user) always gets writable,
# node-owned directories.

services:
  api:
    container_name: ownchagpt-api
    build:
      context: .
      dockerfile: Dockerfile
    image: ownchagpt-api:local
    # CRITICAL: force Docker Compose to rebuild this image on EVERY deploy, even
    # when "ownchagpt-api:local" already exists locally. Without this, Dokploy's
    # redeploy reuses the previous (stale) image, so source fixes pushed to git
    # never reach the running container — the very behavior where "the issue
    # comes back on every redeploy". Requires Docker Compose v2.24+.
    pull_policy: build
    user: "1000:1000"
    ports:
      - "3080:3080"
    depends_on:
      meilisearch:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: always
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - PORT=3080
      # Cap Node heap below the 2g container limit so it GCs instead of OOM-killing.
      - NODE_OPTIONS=--max-old-space-size=1536
      - "MONGO_URI=${MONGO_URI:-mongodb://mongodb:cc7ILFYAPr89oBi2jNbR@ownchatgpt-mongodb-o65fmy:27017/?authSource=admin&directConnection=true}"
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-https://chat.sitenexai.com}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-https://chat.sitenexai.com}
      # REQUIRED in production: the server exits if this is empty. Comma-separated
      # list of browser origins that may call the API (client domain + admin panel).
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://chat.sitenexai.com}
      - ALLOW_REGISTRATION=true
    # Healthcheck: wait for the API to be ready before Traefik routes traffic.
    # Uses Node's built-in fetch (node:alpine ships NO curl), with retry to
    # avoid "Bad Gateway" on startup.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - images:/app/client/public/images
      - skill:/app/skill
      - uploads:/app/uploads
      - logs:/app/logs
    # NOTE: Routing is managed in the Dokploy UI (Domains tab), NOT via compose
    # labels, so the chat domain must point to THIS (api) service on port 3080.
    # A second labels block here would conflict with Dokploy's own Traefik labels.

  admin-panel:
    container_name: ownchagpt-admin
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    ports:
      - "${ADMIN_PANEL_PORT:-3041}:3000"
    depends_on:
      - api
    networks:
      - default
      - dokploy-network
    restart: always
    environment:
      - PORT=3000
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:3080
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-https://chat.sitenexai.com}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-true}
    # NOTE: admin panel routing also managed via Dokploy UI Domains tab.

  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - meili-data:/meili_data

networks:
  dokploy-network:
    external: true

volumes:
  meili-data:
  uploads:
  logs:
  images:
  skill:
