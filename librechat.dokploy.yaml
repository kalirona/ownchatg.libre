# LibreChat custom config for the Dokploy deployment.
# Uses OpenRouter (OpenAI-compatible) as the model provider.
# The API key is read from the OPENROUTER_KEY environment variable (set in
# Dokploy -> Environment), so no secret is stored in this file.
# https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.13

endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'openai/gpt-4o-mini'
          - 'meta-llama/llama-3.1-8b-instruct'
        fetch: true
      titleConvo: true
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'