name: Scheduled Backup

on:
  schedule:
    # Daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type (full or mongodb)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - mongodb

permissions:
  contents: read

env:
  BACKUP_RETENTION_DAYS: 30

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MongoDB URI
        run: |
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> $GITHUB_ENV
          echo "MONGO_URL=${{ secrets.MONGO_URI }}" >> $GITHUB_ENV

      - name: Configure MeiliSearch
        run: |
          echo "MEILI_HOST=${{ secrets.MEILI_HOST || 'http://localhost:7700' }}" >> $GITHUB_ENV
          echo "MEILI_MASTER_KEY=${{ secrets.MEILI_MASTER_KEY }}" >> $GITHUB_ENV

      - name: Run full backup
        if: inputs.backup_type == 'full' || github.event_name == 'schedule'
        run: |
          mkdir -p backups
          chmod +x scripts/backup-full.sh
          ./scripts/backup-full.sh \
            -d backups \
            -r "${{ env.BACKUP_RETENTION_DAYS }}"

      - name: Run MongoDB-only backup
        if: inputs.backup_type == 'mongodb'
        run: |
          mkdir -p backups
          chmod +x scripts/backup-mongodb.sh
          ./scripts/backup-mongodb.sh \
            -d backups \
            -r "${{ env.BACKUP_RETENTION_DAYS }}"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: librechat-backup-${{ github.run_id }}
          path: backups/
          retention-days: ${{ env.BACKUP_RETENTION_DAYS }}
          compression-level: 9

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Backup] Failed - ${new Date().toLocaleDateString()}`,
              body: `## Backup Failed\n\nRun: ${runUrl}\nTime: ${new Date().toISOString()}`,
              labels: ['backup', 'automated']
            });
