name: Scheduled Health Check

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to check (default: production)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

env:
  TARGET_URL: ${{ inputs.target_url || 'https://ownchatgptbusiness.com' }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run health check
        id: check
        run: |
          chmod +x scripts/monitoring/health-check.sh
          if ./scripts/monitoring/health-check.sh "$TARGET_URL" 5000; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Notify on failure
        if: steps.check.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `## ⚠️ Health Check Failed\n\nTarget: **${{ env.TARGET_URL }}**\nRun: ${runUrl}\nTime: ${new Date().toISOString()}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Health Check] Failed - ${new Date().toLocaleDateString()}`,
              body: body,
              labels: ['health-check', 'automated']
            });
