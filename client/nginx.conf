# LibreChat production nginx configuration
# Serves static assets directly for performance; proxies API requests to the backend.

# https://docs.nginx.com/nginx/admin-guide/web-server/compression/
# Map directive required for WebSocket upgrades — $connection_upgrade is used
# by the /api/stream/ proxy location below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
  text/css
  text/plain
  text/xml
  text/html
  application/javascript
  application/json
  application/octet-stream
  application/xml
  application/rss+xml
  application/atom+xml
  application/manifest+json
  image/svg+xml
  image/x-icon
  image/vnd.microsoft.icon
  font/woff
  font/woff2;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    client_max_body_size 25M;

    # ── API proxy ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:3080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Static assets (immutable, far-future cache) ────────────
    location /assets/ {
        proxy_pass http://api:3080/assets/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, immutable, max-age=31536000";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Font files ─────────────────────────────────────────────
    location /fonts/ {
        proxy_pass http://api:3080/fonts/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # ── SPA fallback ───────────────────────────────────────────
    location / {
        proxy_pass http://api:3080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # HTML is dynamic (may change per deploy) — short cache
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300";
    }

    # ── Uploaded files (streaming) ─────────────────────────────
    location /uploads/ {
        proxy_pass http://api:3080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # ── Server-sent events / WebSocket headers ─────────────────
    location /api/stream/ {
        proxy_pass http://api:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }
}

# Admin panel subdomain
server {
    listen 80;
    listen [::]:80;
    server_name admin.localhost;

    client_max_body_size 25M;

    resolver 127.0.0.11 valid=30s;
    set $admin_panel_upstream http://admin-panel:3000;

    location / {
        proxy_pass $admin_panel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
